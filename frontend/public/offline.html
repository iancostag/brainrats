<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1722" />
    <title>BrainRats — Sem conexão</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #f3f1ec;
        color: #111827;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        background: #0f1722;
        color: #ffffff;
        border-bottom: 3px solid #d94e28;
        padding: calc(0.75rem + env(safe-area-inset-top)) 1.25rem 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      header img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid #334155;
        object-fit: cover;
      }
      header span {
        font-weight: 800;
        font-size: 1.05rem;
        letter-spacing: -0.02em;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #ddd8ce;
        border-radius: 12px;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 800;
        color: #0f1722;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.925rem;
        line-height: 1.55;
        color: #475569;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        background: #c2411e;
        color: #ffffff;
        font-weight: 700;
        font-size: 0.925rem;
        padding: 0.75rem 1.25rem;
        min-height: 44px;
        cursor: pointer;
      }
      button:active {
        background: #a83516;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/icon-192.png" alt="BrainRats" />
      <span>BrainRats</span>
    </header>
    <main>
      <section class="card">
        <h1>Você está sem conexão</h1>
        <p>
          O BrainRats precisa de internet para carregar o placar do grupo, registrar novos
          check-ins e sincronizar commits do GitHub.
        </p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
      </section>
    </main>
  </body>
</html>
