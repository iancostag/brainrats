[project]
name = "brainrats-backend"
version = "0.1.0"
description = "Backend API and async sync worker for BrainRats"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "aiosqlite>=0.20.0",
  "arq>=0.26.1",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.7.0",
  "pyjwt>=2.10.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.34",
  "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.2.1",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
